[package]
name = "sol-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
gltf = { workspace = true, features = ["import", "utils"] }
anyhow.workspace = true
log.workspace = true
raw-window-handle.workspace = true

# Native: block on async adapter/device requests.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

# Web: wgpu needs the WebGL backend as a fallback when WebGPU is unavailable.
# `webgpu` is on by default; add `webgl` + the non-atomic send/sync shim that
# wgpu requires on single-threaded wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl", "fragile-send-sync-non-atomic-wasm"] }
