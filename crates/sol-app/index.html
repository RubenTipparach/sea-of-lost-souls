<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sea of Lost Souls</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #04050a;
        overflow: hidden;
      }
      /* winit appends its <canvas> to <body>; make it fill the viewport. */
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6f7a8a;
        font-family: system-ui, sans-serif;
        pointer-events: none;
      }
    </style>
    <!-- eruda: on-device DevTools console for mobile testing. Loads only on
         touch devices, or on any device when the URL carries ?eruda. -->
    <script>
      (function () {
        var force = new URLSearchParams(location.search).has("eruda");
        var touch =
          (navigator.maxTouchPoints || 0) > 0 ||
          /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (!force && !touch) return;
        var s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/eruda@3";
        s.onload = function () {
          if (window.eruda) window.eruda.init();
        };
        document.head.appendChild(s);
      })();
    </script>
    <!-- Trunk injects the wasm-bindgen bootstrap that calls the `start` entry. -->
    <link data-trunk rel="rust" data-wasm-opt="z" data-bin="sol-app" />
  </head>
  <body>
    <div id="loading">Initializing fleet intelligence&hellip;</div>
  </body>
</html>
