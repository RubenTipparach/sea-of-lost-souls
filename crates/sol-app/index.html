<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sea of Lost Souls</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #04050a;
        overflow: hidden;
      }
      /* winit appends its <canvas> to <body>; make it fill the viewport. */
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6f7a8a;
        font-family: system-ui, sans-serif;
        pointer-events: none;
      }
      /* Mobile-only gate. This game is landscape-only on phones/tablets, so we
         cover the whole screen until the device is in landscape. A centered
         overlay (not a corner button) can't be hidden behind the browser's
         toolbars. */
      #orient-gate {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
        background: radial-gradient(circle at 50% 38%, #0b1622, #04050a 70%);
        color: #cfe0f5;
        font-family: system-ui, sans-serif;
      }
      #orient-gate[hidden] {
        display: none;
      }
      #orient-gate .gate-title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.04em;
        margin-bottom: 8px;
      }
      #orient-gate .gate-msg {
        font-size: 15px;
        color: #8aa0bd;
        margin-bottom: 24px;
        max-width: 24em;
      }
      #go-landscape {
        appearance: none;
        border: 1px solid #2b6cb0;
        border-radius: 12px;
        background: #12304d;
        color: #eaf2ff;
        font: 600 17px/1.2 system-ui, sans-serif;
        padding: 16px 28px;
      }
      /* Selection/order controls, the shared command seam for desktop + mobile. */
      #sol-controls {
        position: fixed;
        left: 10px;
        bottom: 10px;
        z-index: 20;
        display: flex;
        gap: 8px;
      }
      #sol-controls button,
      #sol-controls select {
        appearance: none;
        border: 1px solid #2b6cb0;
        border-radius: 8px;
        background: rgba(11, 26, 43, 0.8);
        color: #cfe0f5;
        font: 600 14px/1 system-ui, sans-serif;
        padding: 10px 12px;
        /* Don't let a press-and-hold scroll/zoom the page (box-select). */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #sol-controls select:disabled {
        opacity: 0.55;
      }
      /* Highlight the box-select button while it is held. */
      #sol-box-select:active {
        background: #1c4a73;
        border-color: #4f9fe0;
      }
      /* Highlight the Focus / Sensors buttons while their mode is active. */
      #sol-focus.active,
      #sol-sensors.active {
        background: #1c4a73;
        border-color: #6fb2ee;
        color: #fff;
      }
      /* Shift hint: shown (by the app) while Shift is held on desktop. */
      #sol-shift-hint {
        position: fixed;
        left: 10px;
        bottom: 58px;
        z-index: 21;
        background: rgba(11, 26, 43, 0.92);
        border: 1px solid #4f9fe0;
        border-radius: 8px;
        color: #cfe0f5;
        font: 600 13px/1.3 system-ui, sans-serif;
        padding: 8px 10px;
        pointer-events: none;
      }
      #sol-shift-hint[hidden] {
        display: none;
      }
      /* Full-screen build overlay. It captures all input (so the game pauses
         interaction) but leaves the centre transparent: the wgpu canvas behind
         renders a rotating 3D preview of the selected ship there. */
      #sol-build-overlay {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        pointer-events: auto;
        /* A drag on the empty centre rotates the ship; don't scroll the page. */
        touch-action: none;
        /* Homeworld-style blue gradient backdrop; the centre stays transparent so
           the wgpu canvas behind shows the rotating ship preview. */
        background: radial-gradient(
          circle at 50% 44%,
          rgba(24, 64, 130, 0) 24%,
          rgba(14, 44, 96, 0.42) 60%,
          rgba(6, 20, 52, 0.82) 100%
        );
        font-family: system-ui, sans-serif;
      }
      #sol-build-overlay[hidden] {
        display: none;
      }
      /* Left sidebar: the class list. */
      #sol-bo-list {
        width: 232px;
        height: 100%;
        box-sizing: border-box;
        padding: 16px 14px;
        background: rgba(6, 12, 22, 0.92);
        border-right: 1px solid #1d3a57;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
      }
      #sol-bo-list .bo-title {
        color: #eaf2ff;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.08em;
        margin-bottom: 6px;
      }
      #sol-bo-list button {
        appearance: none;
        border: 1px solid #2b6cb0;
        border-radius: 8px;
        background: rgba(11, 26, 43, 0.92);
        color: #cfe0f5;
        font: 600 14px/1 system-ui, sans-serif;
        padding: 11px 12px;
        text-align: left;
      }
      #sol-bo-list button.sel {
        background: #1c4a73;
        border-color: #6fb2ee;
        color: #fff;
      }
      #sol-bo-list button.poor {
        opacity: 0.45;
      }
      /* Bottom info bar: previewed ship stats + confirm / close. */
      #sol-bo-bar {
        position: fixed;
        left: 252px;
        right: 20px;
        bottom: 20px;
        z-index: 41;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 16px;
        background: rgba(6, 12, 22, 0.92);
        border: 1px solid #1d3a57;
        border-radius: 12px;
      }
      #sol-bo-info {
        flex: 1;
        color: #cfe0f5;
        font: 600 15px/1.2 system-ui, sans-serif;
      }
      #sol-bo-bar button {
        appearance: none;
        border-radius: 8px;
        font: 700 14px/1 system-ui, sans-serif;
        padding: 12px 18px;
      }
      #sol-bo-build {
        position: relative;
        overflow: hidden;
        border: 1px solid #2f9e57;
        background: #16683a;
        color: #eafff1;
      }
      #sol-bo-build:disabled {
        opacity: 0.4;
        border-color: #34465a;
        background: #233040;
        cursor: default;
      }
      /* Build-progress "slider" fill across the button (width set per frame). */
      #sol-bo-build-fill {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 0%;
        background: rgba(120, 235, 165, 0.45);
        pointer-events: none;
        transition: width 0.12s linear;
      }
      .bo-build-label {
        position: relative;
        z-index: 1;
      }
      /* Yellow queue-depth badge (xN) so the queue size reads at a glance. */
      #sol-bo-count {
        position: relative;
        z-index: 1;
        margin-left: 8px;
        color: #ffd54a;
        font-weight: 800;
      }
      #sol-bo-count[hidden] {
        display: none;
      }
      #sol-bo-close,
      #sol-bo-pause {
        border: 1px solid #2b6cb0;
        background: rgba(11, 26, 43, 0.92);
        color: #cfe0f5;
      }
      /* Pause banner, top-center. */
      #sol-paused {
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 41;
        padding: 7px 16px;
        background: rgba(40, 16, 16, 0.82);
        border: 1px solid #c2683a;
        border-radius: 8px;
        color: #ffd9b0;
        font: 800 15px/1 system-ui, sans-serif;
        letter-spacing: 0.12em;
        pointer-events: none;
      }
      #sol-paused[hidden] {
        display: none;
      }
      /* Crew + current-production readouts, top-left under the salvage counter. */
      #sol-crew,
      #sol-build-status {
        position: fixed;
        left: 10px;
        z-index: 21;
        color: #bcd3ee;
        font: 600 13px/1 system-ui, sans-serif;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      #sol-crew {
        top: 44px;
      }
      #sol-build-status {
        top: 64px;
      }
      /* Resource readout: banked salvage, top-left. */
      #sol-resources {
        position: fixed;
        left: 10px;
        top: 10px;
        z-index: 21;
        background: rgba(11, 26, 43, 0.78);
        border: 1px solid #2b6cb0;
        border-radius: 8px;
        color: #ffe2a8;
        font: 700 15px/1 system-ui, sans-serif;
        padding: 9px 12px;
        pointer-events: none;
      }
      /* Mobile camera pad: a pan joystick + a spring-to-center elevation slider.
         Desktop uses WASD / arrows / edge-scroll instead, so the app removes the
         pad on non-mobile. */
      #sol-pad {
        position: fixed;
        inset: 0;
        z-index: 20;
        pointer-events: none;
      }
      #sol-joy,
      #sol-elev {
        position: fixed;
        bottom: 24px;
        pointer-events: auto;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        background: rgba(11, 26, 43, 0.5);
        border: 1px solid #2b6cb0;
      }
      #sol-joy {
        right: 24px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
      }
      #sol-elev {
        right: 156px;
        width: 56px;
        height: 120px;
        border-radius: 28px;
      }
      #sol-joy-knob,
      #sol-elev-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        border-radius: 50%;
        background: rgba(79, 159, 224, 0.85);
        pointer-events: none;
      }
      #sol-joy-knob {
        width: 52px;
        height: 52px;
        margin: -26px 0 0 -26px;
      }
      #sol-elev-knob {
        width: 44px;
        height: 40px;
        margin: -20px 0 0 -22px;
        border-radius: 12px;
      }
      .pad-label {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        color: #7fa6cc;
        font: 700 13px/1 system-ui, sans-serif;
        pointer-events: none;
      }
      #sol-elev .pad-up {
        top: 6px;
      }
      #sol-elev .pad-down {
        bottom: 6px;
      }
    </style>
    <script>
      // Treat phones and tablets as mobile (including iPadOS, which sends a
      // desktop UA but is touch-first). Touch-capable laptops are NOT mobile, so
      // mobile-only UI (eruda, the landscape prompt) stays off on desktop.
      window.__solIsMobile = function () {
        var ua = navigator.userAgent || "";
        if (/Mobi|Android|iPhone|iPad|iPod/i.test(ua)) return true;
        return /Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1;
      };
    </script>
    <!-- eruda: on-device DevTools console. Mobile only (or ?eruda anywhere). -->
    <script>
      (function () {
        var force = new URLSearchParams(location.search).has("eruda");
        if (!force && !window.__solIsMobile()) return;
        var s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/eruda@3";
        s.onload = function () {
          if (window.eruda) window.eruda.init();
        };
        document.head.appendChild(s);
      })();
    </script>
    <!-- Trunk injects the wasm-bindgen bootstrap that calls the `start` entry. -->
    <link data-trunk rel="rust" data-wasm-opt="z" data-bin="sol-app" />
  </head>
  <body>
    <div id="loading">Initializing fleet intelligence&hellip;</div>
    <div id="orient-gate" hidden>
      <div class="gate-title">Sea of Lost Souls</div>
      <div class="gate-msg">
        Landscape only. Rotate your device, or tap to enter fullscreen landscape.
      </div>
      <button id="go-landscape" type="button">Tap to play</button>
    </div>
    <script>
      // Landscape-only on phones/tablets: show a full-screen gate until the
      // device is in landscape. The button enters fullscreen and locks landscape
      // (the user gesture both APIs require); manually rotating also dismisses
      // the gate, so browsers that reject the lock (e.g. iOS) still work.
      (function () {
        var gate = document.getElementById("orient-gate");
        var btn = document.getElementById("go-landscape");
        if (!gate || !btn) return;
        if (!window.__solIsMobile()) {
          gate.remove();
          return;
        }
        function landscape() {
          if (window.matchMedia) {
            return window.matchMedia("(orientation: landscape)").matches;
          }
          return window.innerWidth >= window.innerHeight;
        }
        function refresh() {
          gate.hidden = landscape();
        }
        function go() {
          var el = document.documentElement;
          var fs =
            el.requestFullscreen ||
            el.webkitRequestFullscreen ||
            el.mozRequestFullScreen;
          var entered = fs
            ? Promise.resolve(fs.call(el)).catch(function () {})
            : Promise.resolve();
          entered.then(function () {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock("landscape").catch(function () {});
            }
            setTimeout(refresh, 50);
          });
        }
        btn.addEventListener("click", go);
        window.addEventListener("orientationchange", refresh);
        window.addEventListener("resize", refresh);
        document.addEventListener("fullscreenchange", refresh);
        refresh();
      })();
    </script>
    <div id="sol-resources">Salvage: 0</div>
    <div id="sol-crew"></div>
    <div id="sol-build-status"></div>
    <div id="sol-build-overlay" hidden>
      <div id="sol-bo-list">
        <div class="bo-title">BUILD</div>
        <button id="sol-build-fighter" type="button">Fighter (30)</button>
        <button id="sol-build-bomber" type="button">Bomber (50)</button>
        <button id="sol-build-corvette" type="button">Corvette (120)</button>
        <button id="sol-build-resourcer" type="button">Resourcer (80)</button>
        <button id="sol-build-frigate_general" type="button">Frigate (300)</button>
        <button id="sol-build-frigate_missile" type="button">Missile Frigate (340)</button>
        <button id="sol-build-capital_destroyer" type="button">Destroyer (900)</button>
      </div>
      <div id="sol-bo-bar">
        <div id="sol-bo-info">Fighter</div>
        <button id="sol-bo-pause" type="button">Pause</button>
        <button id="sol-bo-build" type="button">
          <span id="sol-bo-build-fill"></span>
          <span class="bo-build-label">Build</span>
          <span id="sol-bo-count" hidden>x1</span>
        </button>
        <button id="sol-bo-close" type="button">Close</button>
      </div>
    </div>
    <script>
      // Build-overlay turntable: a pointer drag on the empty centre of the
      // overlay rotates the previewed ship. We accumulate the pointer delta into
      // window globals that the wasm app samples (and zeroes) each frame; the app
      // resumes the auto-spin after a short idle. Dragging on the class list or
      // the bottom bar is a real button press, so we only start on the overlay
      // element itself.
      (function () {
        window.__solPrevDX = 0;
        window.__solPrevDY = 0;
        window.__solPrevDrag = 0;
        var ov = document.getElementById("sol-build-overlay");
        if (!ov) return;
        var pid = null,
          lastX = 0,
          lastY = 0;
        ov.addEventListener("pointerdown", function (e) {
          if (e.target !== ov) return;
          pid = e.pointerId;
          lastX = e.clientX;
          lastY = e.clientY;
          window.__solPrevDrag = 1;
          try {
            ov.setPointerCapture(pid);
          } catch (_) {}
          e.preventDefault();
        });
        ov.addEventListener("pointermove", function (e) {
          if (e.pointerId !== pid) return;
          window.__solPrevDX += e.clientX - lastX;
          window.__solPrevDY += e.clientY - lastY;
          lastX = e.clientX;
          lastY = e.clientY;
          e.preventDefault();
        });
        function end(e) {
          if (e.pointerId !== pid) return;
          pid = null;
          window.__solPrevDrag = 0;
        }
        ov.addEventListener("pointerup", end);
        ov.addEventListener("pointercancel", end);
      })();
    </script>
    <div id="sol-paused" hidden>PAUSED</div>
    <div id="sol-controls">
      <button id="sol-pause" type="button">Pause</button>
      <button id="sol-build-toggle" type="button">Build</button>
      <button id="sol-select-all" type="button">Select All</button>
      <button id="sol-box-select" type="button">Box Select</button>
      <button id="sol-formation" type="button">Form: Parade</button>
      <select id="sol-stance" aria-label="Stance for the selected ships" disabled>
        <option value="passive">Passive</option>
        <option value="defensive" selected>Defensive</option>
        <option value="aggressive">Aggressive</option>
        <option value="mixed" disabled>Mixed</option>
      </select>
      <button id="sol-focus" type="button">Focus</button>
      <button id="sol-sensors" type="button">Sensors</button>
      <button id="sol-stop" type="button">Stop</button>
      <button id="sol-clear" type="button">Clear</button>
    </div>
    <script>
      // Blur a control button after clicking so Space/Enter (pause, etc.) don't
      // re-activate the last-focused button.
      document.addEventListener("click", function (e) {
        if (e.target && e.target.tagName === "BUTTON") e.target.blur();
      });
    </script>
    <div id="sol-shift-hint" hidden>Shift: A = Select All, S = Stop</div>
    <div id="sol-pad">
      <div id="sol-elev">
        <div class="pad-label pad-up">UP</div>
        <div id="sol-elev-knob"></div>
        <div class="pad-label pad-down">DN</div>
      </div>
      <div id="sol-joy"><div id="sol-joy-knob"></div></div>
    </div>
    <script>
      // Mobile camera pad. The joystick pans (right = +X, push up = forward) and
      // the vertical slider changes elevation (push up = ascend); both spring to
      // center and write normalized [-1, 1] values to window globals that the
      // wasm app samples each frame. Desktop uses WASD / arrows / edge-scroll, so
      // the pad is removed off mobile.
      (function () {
        window.__solPanX = 0;
        window.__solPanY = 0;
        window.__solElev = 0;
        var pad = document.getElementById("sol-pad");
        if (!pad) return;
        if (!window.__solIsMobile || !window.__solIsMobile()) {
          pad.remove();
          return;
        }

        // A spring-to-center analog control. `apply(nx, ny)` receives the knob
        // offset normalized to [-1, 1]; `reset` recenters and zeroes output.
        function analog(el, knob, axis, apply) {
          if (!el || !knob) return;
          var id = null;
          function move(e) {
            if (e.pointerId !== id) return;
            var r = el.getBoundingClientRect();
            var cx = r.left + r.width / 2;
            var cy = r.top + r.height / 2;
            var dx = e.clientX - cx;
            var dy = e.clientY - cy;
            if (axis === "y") dx = 0;
            var max = (axis === "y" ? r.height : r.width) * 0.4;
            var len = Math.hypot(dx, dy) || 1;
            if (len > max) {
              dx *= max / len;
              dy *= max / len;
            }
            knob.style.transform = "translate(" + dx + "px," + dy + "px)";
            apply(dx / max, dy / max);
            e.preventDefault();
          }
          function end(e) {
            if (e.pointerId !== id) return;
            id = null;
            knob.style.transform = "translate(0px,0px)";
            apply(0, 0);
          }
          el.addEventListener("pointerdown", function (e) {
            id = e.pointerId;
            el.setPointerCapture(id);
            move(e);
            e.preventDefault();
          });
          el.addEventListener("pointermove", move);
          el.addEventListener("pointerup", end);
          el.addEventListener("pointercancel", end);
        }

        analog(
          document.getElementById("sol-joy"),
          document.getElementById("sol-joy-knob"),
          "xy",
          function (nx, ny) {
            window.__solPanX = nx;
            window.__solPanY = -ny; // up on screen = forward
          }
        );
        analog(
          document.getElementById("sol-elev"),
          document.getElementById("sol-elev-knob"),
          "y",
          function (nx, ny) {
            window.__solElev = -ny; // up = ascend
          }
        );
      })();
    </script>
  </body>
</html>
