name: build-and-deploy

# Build the wasm game + the web ship editor and deploy to GitHub Pages on every
# push to any branch (no main-branch gate), using the official GitHub Actions
# Pages flow. One run per push: one build job, then one deploy job. A single
# shared Pages deployment; the latest push wins. See design.md §17.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Concurrency is not about the steps inside one run (that is always build then
# deploy); it guards OVERLAPPING runs. If you push twice in quick succession the
# newer push cancels the older in-flight run for the same ref, so the live site
# tracks the latest commit and two deploys never race the single github-pages
# environment.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (wasm game + editor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1) Compile + validate ship assets (fails the build on bad ships).
      - name: Compile ship assets
        run: cargo run -p sol-shipc -- build assets/ships --out assets/compiled

      # 2) Build the wasm game (output: crates/sol-app/dist).
      - name: Build game (wasm)
        working-directory: crates/sol-app
        run: trunk build --release

      # 3) Build the web ship editor (output: editor/dist).
      - name: Build ship editor
        working-directory: editor
        run: |
          npm ci
          npm run build

      # 4) Assemble the site: game at root, editor under /editor.
      - name: Assemble site
        run: |
          mkdir -p site_build/editor
          cp -r crates/sol-app/dist/. site_build/
          cp -r editor/dist/. site_build/editor/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_build

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
