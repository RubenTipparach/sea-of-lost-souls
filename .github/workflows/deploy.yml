name: build-and-deploy

# Build the wasm game + the web ship editor and deploy to GitHub Pages on every
# commit to any branch (no main-branch gate), using the official GitHub Actions
# Pages flow. A single Pages deployment is shared across branches: last push
# wins. PRs build for verification but do not deploy. See design.md §17.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel an in-flight run only when a newer run for the SAME ref arrives (so a
# newer push to a branch supersedes its own older deploy). The group is keyed by
# ref on purpose: a shared "pages" group made the PR-verification run cancel the
# deploying push run (push and PR have different refs), which silently skipped
# every deploy. The github-pages environment serializes the actual deployments.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (wasm game + editor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable + wasm target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Install trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1) Compile + validate ship assets (fails the build on bad ships).
      - name: Compile ship assets
        run: cargo run -p sol-shipc -- build assets/ships --out assets/compiled

      # 2) Build the wasm game (output: crates/sol-app/dist).
      - name: Build game (wasm)
        working-directory: crates/sol-app
        run: trunk build --release

      # 3) Build the web ship editor (output: editor/dist).
      - name: Build ship editor
        working-directory: editor
        run: |
          npm ci
          npm run build

      # 4) Assemble the site: game at root, editor under /editor.
      - name: Assemble site
        run: |
          mkdir -p site_build/editor
          cp -r crates/sol-app/dist/. site_build/
          cp -r editor/dist/. site_build/editor/

      # Pages artifact is only produced on push. PR builds (which may come from
      # forks with read-only tokens) just verify the build above.
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_build

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
